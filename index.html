<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>英法行旅地图</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Load web fonts without blocking first paint; where Google Fonts is unreachable the page renders with system fonts. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;900&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;900&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&display=swap"></noscript>
<style>
:root{
  --sans:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --serif:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --en:"Libre Caslon Text",Georgia,"Times New Roman",serif;
  --sea:#c9dfe8; --sea-hi:#dbeaf0; --sea-edge:#e6f1f5; --sea-ink:#5f8ea3; --grat:#a9c7d4;
  --land-hi:#fdfbf4; --land-lo:#eee7d6; --coast:#7d9fae;
  --side1:#ddd3bc; --side2:#cabd9f; --side3:#b3a483; --shadow:rgba(38,70,88,.13);
  --other:#e5e3da; --other-edge:#c3c3b8;
  --b-major:#a7967a; --b-minor:#cfc4ab;
  --river:#74a9c2; --river-ink:#4f86a0; --lake:#bcd8e4;
  --plain:#e3ebd2; --upland:#ece2cb; --mount:#e2d5ba; --mount-ink:#a28f6c;
  --ink:#1f2d36; --ink-2:#4d5c66; --ink-3:#7a8790; --halo:#fffdf6;
  --hl:#f4c33f; --hl-stroke:#c98c0c; --hl-fill:rgba(244,195,63,.30); --hl-ink:#2b2106;
  --ap-fill:rgba(56,138,204,.16); --ap-stroke:#2f7fc0;
  --panel:rgba(255,253,247,.9); --panel-solid:#fffdf8; --line:#e2dac8; --chip:#f3eee2;
  --accent:#1f6f8b; --accent-ink:#ffffff; --badge:#fffaf0;
  --sh:0 1px 2px rgba(30,45,55,.08),0 6px 18px rgba(30,45,55,.10);
  --sh-lg:0 2px 6px rgba(30,45,55,.10),0 18px 48px rgba(30,45,55,.18);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --sea:#0f1c24; --sea-hi:#16303d; --sea-edge:#173341; --sea-ink:#6f9fb4; --grat:#1f3a47;
    --land-hi:#34404a; --land-lo:#27313a; --coast:#5d8ea2;
    --side1:#1c252d; --side2:#151c22; --side3:#0d1216; --shadow:rgba(0,0,0,.35);
    --other:#1d262d; --other-edge:#2d3a43;
    --b-major:#6f7c86; --b-minor:#3c4852;
    --river:#3f7c98; --river-ink:#7fb4cc; --lake:#1c3a49;
    --plain:#2b3a2f; --upland:#3a3a32; --mount:#43413a; --mount-ink:#8a8470;
    --ink:#eaf0f2; --ink-2:#b3c2ca; --ink-3:#8898a2; --halo:#1a232a;
    --hl:#f2c14e; --hl-stroke:#f2c14e; --hl-fill:rgba(242,193,78,.22); --hl-ink:#231a04;
    --ap-fill:rgba(96,175,235,.18); --ap-stroke:#6bb5ea;
    --panel:rgba(24,32,39,.88); --panel-solid:#1a232a; --line:#2e3b45; --chip:#24303a;
    --accent:#6fbad6; --accent-ink:#0d1a20; --badge:#fffaf0;
    --sh:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.3);
    --sh-lg:0 2px 6px rgba(0,0,0,.3),0 18px 48px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --sea:#0f1c24; --sea-hi:#16303d; --sea-edge:#173341; --sea-ink:#6f9fb4; --grat:#1f3a47;
  --land-hi:#34404a; --land-lo:#27313a; --coast:#5d8ea2;
  --side1:#1c252d; --side2:#151c22; --side3:#0d1216; --shadow:rgba(0,0,0,.35);
  --other:#1d262d; --other-edge:#2d3a43;
  --b-major:#6f7c86; --b-minor:#3c4852;
  --river:#3f7c98; --river-ink:#7fb4cc; --lake:#1c3a49;
  --plain:#2b3a2f; --upland:#3a3a32; --mount:#43413a; --mount-ink:#8a8470;
  --ink:#eaf0f2; --ink-2:#b3c2ca; --ink-3:#8898a2; --halo:#1a232a;
  --hl:#f2c14e; --hl-stroke:#f2c14e; --hl-fill:rgba(242,193,78,.22); --hl-ink:#231a04;
  --ap-fill:rgba(96,175,235,.18); --ap-stroke:#6bb5ea;
  --panel:rgba(24,32,39,.88); --panel-solid:#1a232a; --line:#2e3b45; --chip:#24303a;
  --accent:#6fbad6; --accent-ink:#0d1a20; --badge:#fffaf0;
  --sh:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.3);
  --sh-lg:0 2px 6px rgba(0,0,0,.3),0 18px 48px rgba(0,0,0,.45);
}
html,body{height:100%;overflow:hidden}
body{background:var(--sea);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
#app{position:fixed;inset:0;overflow:hidden}
#map{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
#map:active{cursor:grabbing}
#map path{vector-effect:non-scaling-stroke}
#map .pk{vector-effect:none}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- geography layers ---------- */
.sea-bg{fill:url(#seaGrad)}
.grat{fill:none;stroke:var(--grat);stroke-width:.7;stroke-dasharray:1 5;opacity:.7}
.halo-u{fill:none;stroke:var(--sea-edge);stroke-width:16;stroke-linejoin:round;opacity:.85}
.other{fill:var(--other);stroke:var(--other-edge);stroke-width:.8}
.shadow{fill:var(--shadow)}
.side1{fill:var(--side1)} .side2{fill:var(--side2)} .side3{fill:var(--side3)}
.landtop{fill:url(#landGrad)}
.coast{fill:none;stroke:var(--coast);stroke-width:1.15;stroke-linejoin:round}
.terr{stroke-width:9;stroke-linejoin:round;stroke-opacity:.45;opacity:.55;transition:opacity .35s}
.terr.plain{fill:var(--plain);stroke:var(--plain)}
.terr.upland{fill:var(--upland);stroke:var(--upland)}
.terr.mount{fill:var(--mount);stroke:var(--mount)}
.peaks{fill:url(#peaks);opacity:0;transition:opacity .35s}
.pk{fill:none;stroke:var(--mount-ink);stroke-width:1.1;stroke-linecap:round;stroke-linejoin:round}
.riv{fill:none;stroke:var(--river);stroke-linecap:round;stroke-linejoin:round;opacity:0;transition:opacity .35s}
.riv.maj{stroke-width:1.8} .riv.min{stroke-width:1.1}
.lake{fill:var(--lake);stroke:var(--coast);stroke-width:.6;opacity:0;transition:opacity .35s}
.lake.big{opacity:.9}
.b-major{fill:none;stroke:var(--b-major);stroke-width:1;stroke-dasharray:6 3 1.5 3;opacity:.45;transition:opacity .35s}
.b-minor{fill:none;stroke:var(--b-minor);stroke-width:.7;opacity:0;transition:opacity .35s}
#map[data-level="2"] .terr,#map[data-level="3"] .terr{opacity:.85}
#map[data-level="2"] .peaks{opacity:.5} #map[data-level="3"] .peaks{opacity:.75}
#map[data-level="2"] .riv.maj{opacity:.9} #map[data-level="3"] .riv{opacity:1} #map[data-level="3"] .riv.maj{stroke-width:2.4} #map[data-level="3"] .riv.min{stroke-width:1.4}
#map[data-level="2"] .lake,#map[data-level="3"] .lake{opacity:1}
#map[data-level="2"] .b-major,#map[data-level="3"] .b-major{opacity:.8}
#map[data-level="2"] .b-minor{opacity:.4} #map[data-level="3"] .b-minor{opacity:.8}
.hlg{opacity:0;transition:opacity .2s;pointer-events:none}
.hlg.on{opacity:1}
.hl{fill:var(--hl-fill);stroke:var(--hl-stroke);stroke-width:2.2;stroke-linejoin:round}
.hl-glow{fill:none;stroke:var(--hl);stroke-width:9;stroke-linejoin:round;opacity:.35}
.hlg.approx .hl{fill:var(--ap-fill);stroke:var(--ap-stroke);stroke-dasharray:7 5}
.hlg.approx .hl-glow{stroke:var(--ap-stroke);opacity:.18}

/* ---------- secondary labels ---------- */
/* Hidden labels/markers switch to visibility:hidden once faded, so the browser stops painting them on every pan/zoom frame. */
.sl{pointer-events:none;transition:opacity .25s,visibility 0s}
.sl.off{opacity:0;visibility:hidden;transition:opacity .25s,visibility 0s .25s}
.sl text{paint-order:stroke;stroke:var(--halo);stroke-width:3px;stroke-linejoin:round;text-anchor:middle;dominant-baseline:central}
.sl.nation text,.sl.nb text,.sl.region text{fill:var(--ink-3)}
.sl.sea text{fill:var(--sea-ink);stroke:none}
.sl.nb text{stroke:var(--other)}
.sl.terrain text{fill:var(--mount-ink)}
.sl.river text,.sl.lakel text{fill:var(--river-ink)}

/* ---------- place markers ---------- */
.pl{cursor:pointer;transition:opacity .2s,visibility 0s;outline:none}
.pl.off{opacity:0;visibility:hidden;pointer-events:none;transition:opacity .2s,visibility 0s .2s}
.pl{--ics:color-mix(in srgb,var(--ic) 20%,#fffaf2)}
.pl .gsh{fill:rgba(18,30,40,.28)}
.pl .tail{fill:var(--ic)}
.pl .badge{fill:var(--badge);stroke:var(--ic);stroke-width:2}
.pl.t1 .badge{stroke-width:2.6}
.pl .ring{fill:none;stroke:var(--hl);stroke-width:3.5;opacity:0;transition:opacity .2s}
.pl .pin{transition:transform .18s cubic-bezier(.3,1.6,.5,1);filter:drop-shadow(0 2px 2.5px rgba(20,35,45,.28))}
.pl .lab{transition:opacity .2s,visibility 0s}
.pl.nolab .lab{opacity:0;visibility:hidden;pointer-events:none;transition:opacity .2s,visibility 0s .2s}
.pl .lab rect{fill:var(--hl);opacity:0;stroke:var(--hl-stroke);stroke-width:1}
.pl text{font-family:var(--sans);fill:var(--ink);paint-order:stroke;stroke:var(--halo);stroke-width:3.8px;stroke-linejoin:round;dominant-baseline:central;text-anchor:middle}
.pl.t3:not(.active):not(:hover) .l1,.pl .l2{fill:var(--ink-2)}
.pl:hover .pin,.pl.active .pin,.pl:focus-visible .pin{transform:scale(1.14)}
.pl.active .ring,.pl:focus-visible .ring{opacity:1}
.pl.active .badge{stroke:var(--hl-stroke)}
.pl.active .tail{fill:var(--hl-stroke)}
.pl.active .lab rect,.pl:hover .lab rect{opacity:1}
.pl.active text,.pl:hover text{stroke:none;fill:var(--hl-ink)}
.pl .pulse{fill:none;stroke:var(--hl-stroke);stroke-width:2;opacity:0}
.pl.active .pulse{animation:pulse 1.9s ease-out infinite}
@keyframes pulse{0%{transform:scale(.35);opacity:.9}100%{transform:scale(2.6);opacity:0}}
.i-l{fill:var(--ics);stroke:var(--ic);stroke-width:1.5;stroke-linejoin:round}
.i-f{fill:var(--ic)}
.i-s{fill:none;stroke:var(--ic);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.i-d{fill:none;stroke:var(--ic);stroke-width:2.1;stroke-linecap:round}
.i-w{fill:#fffaf0;stroke:var(--ic);stroke-width:1.2}

/* ---------- chrome ---------- */
.bar{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:16px;right:16px;display:flex;align-items:center;gap:10px;pointer-events:none;z-index:5}
.bar>*{pointer-events:auto}
.glass{background:var(--panel);-webkit-backdrop-filter:blur(12px) saturate(1.2);backdrop-filter:blur(12px) saturate(1.2);border:1px solid var(--line);box-shadow:var(--sh)}
.brand{display:flex;align-items:center;gap:10px;border-radius:14px;padding:7px 14px 7px 9px}
.brand svg{flex:none}
.brand h1{margin:0;font-family:var(--serif);font-weight:900;font-size:18px;letter-spacing:.08em;line-height:1.2}
.brand small{display:block;font-family:var(--en);font-style:italic;font-size:11.5px;color:var(--ink-3);letter-spacing:.02em}
.tabs{display:flex;gap:2px;border-radius:14px;padding:4px}
.tabs button{border:0;background:none;color:var(--ink-2);font-size:14.5px;font-weight:500;padding:8px 14px;border-radius:10px;cursor:pointer;display:flex;align-items:baseline;gap:6px;transition:background .2s,color .2s}
.tabs button:hover{background:var(--chip)}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.tabs .n{font-size:11.5px;opacity:.8;font-variant-numeric:tabular-nums}
.grow{flex:1}
.iconbtn{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:var(--ink);cursor:pointer;padding:0}
.iconbtn svg{width:20px;height:20px}

.ctl{position:absolute;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;align-items:flex-end;gap:10px;z-index:4}
.zgrp{display:flex;flex-direction:column;border-radius:12px;overflow:hidden}
.zgrp button{width:42px;height:42px;border:0;background:none;color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.zgrp button+button{border-top:1px solid var(--line)}
.zgrp button:hover{background:var(--chip)}
.zgrp svg{width:18px;height:18px}
.lvl{border-radius:999px;padding:6px 12px;font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.lvl b{color:var(--ink);font-weight:700}
.lvl .dots{display:inline-flex;gap:3px;margin-left:6px;vertical-align:middle}
.lvl .dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.lvl .dots i.on{background:var(--accent)}

.legend{position:absolute;left:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));border-radius:14px;z-index:4;max-width:min(340px,calc(100% - 32px));font-size:12.5px}
.legend summary{cursor:pointer;list-style:none;padding:9px 14px;font-weight:500;color:var(--ink-2);display:flex;gap:8px;align-items:center}
.legend summary::-webkit-details-marker{display:none}
.legend summary::after{content:"";width:7px;height:7px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(-135deg) translateY(-2px);margin-left:auto}
.legend[open] summary::after{transform:rotate(45deg) translateY(-2px)}
.lg-body{padding:0 14px 12px;display:grid;gap:10px}
.lg-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px 8px}
.lg{display:flex;align-items:center;gap:5px;color:var(--ink-2);white-space:nowrap}
.lg svg{width:20px;height:20px;flex:none;--ics:color-mix(in srgb,var(--ic) 20%,#fffaf2)}
.lg-keys{display:grid;gap:5px;color:var(--ink-2);border-top:1px solid var(--line);padding-top:9px}
.key{display:flex;gap:8px;align-items:center}
.sw{width:22px;height:12px;border-radius:3px;flex:none;background:var(--hl-fill);border:2px solid var(--hl-stroke)}
.sw.ap{background:var(--ap-fill);border:2px dashed var(--ap-stroke)}
.lg-note{color:var(--ink-3);line-height:1.55}

.hint{position:absolute;left:50%;top:calc(74px + env(safe-area-inset-top,0px));transform:translateX(-50%);border-radius:999px;padding:7px 14px;font-size:12.5px;color:var(--ink-2);z-index:3;white-space:nowrap;transition:opacity .6s;pointer-events:none}
.hint.gone{opacity:0}

/* ---------- language ---------- */
.langseg{display:flex;gap:2px;border-radius:12px;padding:3px}
.langseg button{border:0;background:none;color:var(--ink-2);font-size:13px;font-weight:500;height:34px;padding:0 11px;border-radius:9px;cursor:pointer;white-space:nowrap}
.langseg button:hover{background:var(--chip)}
.langseg button[aria-pressed="true"]{background:var(--chip);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line);font-weight:700}
.langbtn{display:none;width:auto;min-width:42px;padding:0 9px;font-size:13px;font-weight:700}
.bi-en{display:block;font-family:var(--en);font-style:italic;font-weight:400;font-size:.86em;letter-spacing:0;color:var(--ink-3)}
.bi-en-i{margin-left:.4em;font-family:var(--en);font-style:italic;font-weight:400;letter-spacing:0;opacity:.8}
.c-sec h3 .bi-en,.legend summary .bi-en{display:inline;margin-left:.5em;text-transform:none}
.hint .bi-en{font-size:12px}
html[lang="en"] .brand h1{font-family:var(--en);font-weight:700;letter-spacing:.01em;font-size:17px}
.lg-grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.lg-grid.two .lg{white-space:normal;align-items:flex-start;line-height:1.35}

/* ---------- detail card ---------- */
#card{position:absolute;top:calc(74px + env(safe-area-inset-top,0px));right:16px;width:360px;max-height:calc(100% - 74px - 168px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:auto;overscroll-behavior:contain;background:var(--panel-solid);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh-lg);z-index:6;padding:18px 18px 16px;animation:cardIn .22s ease-out}
@keyframes cardIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.c-head{display:flex;gap:12px;align-items:flex-start}
.c-ic{width:52px;height:52px;border-radius:50%;background:var(--badge);border:2.5px solid var(--ic);display:grid;place-items:center;flex:none;--ics:color-mix(in srgb,var(--ic) 20%,#fffaf2)}
.c-ic svg{width:34px;height:34px}
.c-title{flex:1;min-width:0}
.c-title h2{margin:0;font-family:var(--serif);font-weight:900;font-size:24px;line-height:1.2;letter-spacing:.04em;text-wrap:balance}
.c-title .en{margin:2px 0 0;font-family:var(--en);font-style:italic;font-size:14px;color:var(--ink-2)}
.c-expand{display:none}
.c-close{width:32px;height:32px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--ink-2);cursor:pointer;display:grid;place-items:center;flex:none;padding:0}
.c-close:hover{background:var(--chip)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0}
.chip{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--chip);color:var(--ink-2)}
.chip.ty{background:color-mix(in srgb,var(--ic) 16%,transparent);color:var(--ink)}
.intro{margin:12px 0 0;line-height:1.75;font-size:14px;color:var(--ink)}
.c-sec{margin:14px 0 0}
.c-sec h3{margin:0 0 7px;font-size:12px;font-weight:700;letter-spacing:.18em;color:var(--ink-3)}
.sights{margin:0;padding:0;list-style:none;display:grid;gap:5px}
.sights li{display:flex;gap:8px;align-items:baseline;font-size:14px;line-height:1.5}
.sights li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ic);flex:none;transform:translateY(-2px)}
.photo-section{margin:14px 0 0}
.photo-section>h3,.photo-subhead h3{margin:0 0 8px;font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--ink-3)}
.photo-hero{margin:0 0 12px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel-solid)}
.photo-stage{position:relative;display:grid;place-items:center;overflow:hidden;aspect-ratio:16/9;background:linear-gradient(135deg,var(--chip),var(--sea-hi));}
.photo-hero .photo-stage{aspect-ratio:16/8.5}
.photo-stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .25s ease}
.photo-stage.loaded img{opacity:1}
.photo-placeholder{position:relative;z-index:1;display:grid;justify-items:center;gap:7px;padding:12px;color:var(--ink-3);font-size:11.5px;text-align:center;line-height:1.45;transition:opacity .2s}
.photo-placeholder svg{width:30px;height:30px;--ics:color-mix(in srgb,var(--ic) 20%,#fffaf2)}
.photo-stage.loaded .photo-placeholder{opacity:0}
.photo-stage.no-photo .photo-placeholder{opacity:1}
.photo-stage.no-photo .photo-shimmer{display:none}
.photo-shimmer{position:absolute;inset:0;background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.32) 48%,transparent 66%);transform:translateX(-100%);animation:photoShimmer 1.5s ease-in-out infinite}
@keyframes photoShimmer{to{transform:translateX(100%)}}
.photo-caption{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 11px}
.photo-caption strong{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;font-weight:700}
.photo-credit{display:inline-block;max-width:58%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-3);font-size:10px;text-decoration:none;text-align:right}
.photo-credit:hover{color:var(--accent);text-decoration:underline}
.photo-subhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:12px 0 8px}
.photo-subhead h3{margin:0}
.photo-count{font-size:10.5px;color:var(--ink-3)}
.photo-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.photo-tile{min-width:0;margin:0;overflow:hidden;border:1px solid var(--line);border-radius:12px;background:var(--panel-solid)}
.photo-tile .photo-caption{display:block;padding:8px 9px 9px}
.photo-tile .photo-caption strong{display:block;white-space:normal;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;max-height:2.8em;line-height:1.4;overflow:hidden;font-size:12px}
.photo-tile .photo-credit{display:block;max-width:100%;margin-top:4px;overflow:visible;white-space:normal;text-overflow:clip;overflow-wrap:anywhere;line-height:1.35;text-align:left;font-size:9.5px}
.photo-tile .photo-placeholder svg{width:24px;height:24px}
.range{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--hl-fill);border:1px solid var(--hl-stroke)}
.range.ap{background:var(--ap-fill);border:1px dashed var(--ap-stroke)}
.range .sw{margin-top:3px}
.range b{display:block;font-size:14px}
.range em{display:block;font-style:normal;font-size:12px;color:var(--ink-2);margin-top:2px}
.near{display:flex;flex-wrap:wrap;gap:6px}
.near button{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel-solid);color:var(--ink);border-radius:999px;padding:4px 10px 4px 5px;font-size:13px;cursor:pointer;--ics:color-mix(in srgb,var(--ic) 20%,#fffaf2)}
.near button:hover{border-color:var(--accent);background:var(--chip)}
.near svg{width:20px;height:20px}
.near small{color:var(--ink-3);font-size:11.5px;font-variant-numeric:tabular-nums}
.ext{display:inline-flex;gap:6px;align-items:center;margin-top:14px;color:var(--accent);font-size:13.5px;font-weight:500;text-decoration:none}
.ext:hover{text-decoration:underline}
.c-title h2[lang="en"]{font-family:var(--en);font-weight:700;letter-spacing:0}
.c-title .sub{margin:3px 0 0;font-size:14px;color:var(--ink-2)}
.intro-en{margin:8px 0 0;font-family:var(--en);font-size:13.5px;line-height:1.65;color:var(--ink-2)}
.se{display:block;font-family:var(--en);font-style:italic;font-weight:400;font-size:12.5px;color:var(--ink-3)}
.near .nen{font-family:var(--en);font-style:italic;font-size:12px;color:var(--ink-3)}
.links{display:flex;flex-direction:column;align-items:flex-start;gap:6px;margin-top:14px}
.links .ext{margin-top:0}
.pinhint{margin:10px 0 0;font-size:12px;color:var(--ink-3);display:flex;gap:6px;align-items:center}
.pinhint i{width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
#card[data-pinned="true"] .pinhint i{background:var(--hl-stroke)}

@media (max-width:720px){
  .ctl{right:12px;bottom:calc(var(--sheet-height,0px) + 10px);z-index:7}
  #app.sheet-expanded .ctl{display:none}
  .zgrp{flex-direction:row}
  .zgrp button{width:44px;height:44px}
  .zgrp button+button{border-top:0;border-left:1px solid var(--line)}
  .bar{left:12px;right:12px;gap:6px}
  .brand small,.brand svg{display:none}
  .brand{padding:9px 12px}
  .brand h1{font-size:16px;letter-spacing:.04em}
  .tabs button{min-height:44px;padding:7px 11px;font-size:14px}
  .tabs .n,.tabs .bi-en-i{display:none}
  .langseg{display:none}
  .langbtn{display:grid}
  .iconbtn{width:44px;height:44px}
  .legend summary{min-height:44px}
  .hint{top:auto;left:16px;right:74px;transform:none;bottom:calc(74px + env(safe-area-inset-bottom,0px));white-space:normal;text-align:center;border-radius:14px}
  .lvl{display:none}
  #card{left:0;right:0;bottom:0;top:auto;width:auto;box-sizing:border-box;max-height:min(56dvh,calc(100dvh - 130px - env(safe-area-inset-top,0px)));border-radius:20px 20px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px));border-left:0;border-right:0;border-bottom:0;animation-name:sheetIn;-webkit-overflow-scrolling:touch;transition:max-height .25s ease}
  #card.expanded{max-height:calc(100dvh - 80px - env(safe-area-inset-top,0px))}
  .c-head{position:sticky;top:-14px;z-index:2;margin:-14px -16px 0;padding:24px 16px 10px;background:var(--panel-solid);align-items:center;border-radius:20px 20px 0 0;border-bottom:1px solid var(--line)}
  .c-head::before{content:"";position:absolute;top:8px;left:50%;transform:translateX(-50%);width:40px;height:4px;border-radius:2px;background:var(--line)}
  .c-expand,.c-close{width:44px;height:44px;min-width:44px;min-height:44px}
  .c-expand{border:1px solid var(--line);border-radius:10px;background:var(--chip);color:var(--ink);cursor:pointer;display:grid;place-items:center;padding:0}
  .c-expand svg{width:18px;height:18px;transition:transform .2s}
  #card.expanded .c-expand svg{transform:rotate(180deg)}
  .c-title h2{font-size:21px}
  .photo-grid{grid-template-columns:1fr;gap:10px}
  .photo-tile{display:grid;grid-template-columns:112px minmax(0,1fr);min-height:112px}
  .photo-tile .photo-stage{height:100%;min-height:112px;aspect-ratio:auto}
  .photo-tile .photo-caption{display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:10px 12px;min-width:0}
  .photo-tile .photo-caption strong{font-size:14px;max-height:none;-webkit-line-clamp:3;line-clamp:3}
  .photo-tile .photo-credit{font-size:10.5px;line-height:1.4}
  .near button{min-height:44px;padding:6px 11px 6px 8px}
  .ext{min-height:44px;align-items:center}
  @keyframes sheetIn{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
}
@media (max-width:480px){.brand{display:none}}
@media (max-width:360px){.photo-tile{grid-template-columns:98px minmax(0,1fr)}.photo-tile .photo-stage{min-height:104px}.c-head{gap:8px}.c-ic{width:44px;height:44px}.c-ic svg{width:29px;height:29px}.c-title h2{font-size:19px}}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>

const O = TOPO.objects;
const unitGeoms = O.units.geometries;
const byName = {};
unitGeoms.forEach(g => { (byName[g.properties.c+':'+g.properties.n] ||= []).push(g); });
const landBy = {
  GBR: topojson.merge(TOPO, unitGeoms.filter(g => g.properties.c === 'GBR')),
  FRA: topojson.merge(TOPO, unitGeoms.filter(g => g.properties.c === 'FRA'))
};
const nbLand = topojson.merge(TOPO, O.nb.geometries);
const same = (a,b,c) => a !== b && a.properties.c === c && b.properties.c === c;
const MESH = {
  GBR: {major: topojson.mesh(TOPO, O.units, (a,b) => same(a,b,'GBR') && a.properties.g !== b.properties.g),
        minor: topojson.mesh(TOPO, O.units, (a,b) => same(a,b,'GBR') && a.properties.g === b.properties.g)},
  FRA: {major: topojson.mesh(TOPO, O.units, (a,b) => same(a,b,'FRA') && a.properties.r !== b.properties.r),
        minor: topojson.mesh(TOPO, O.units, (a,b) => same(a,b,'FRA') && a.properties.r === b.properties.r)}
};
const RIVERS = topojson.feature(TOPO, O.rivers).features;
const LAKES = topojson.feature(TOPO, O.lakes).features;
// The graticule is dashed in screen space, so its on-screen length drives the per-frame cost.
// Only the part around the current view is drawn (never beyond Western Europe: a whole-globe
// grid under the conic projection froze Safari, and a zoomed full grid made Chrome drag at ~20 fps).
const GRAT_MAX = [[-40, 25], [45, 75]], GRAT_STEP = 2;
let gratBox = null;

function ringPoly(pts){
  const ring = pts.concat([pts[0]]);
  let g = {type:'Polygon', coordinates:[ring]};
  if (d3.geoArea(g) > 2*Math.PI) g = {type:'Polygon', coordinates:[ring.slice().reverse()]};
  return g;
}
function regionGeom(p){
  if (p._g) return p._g;
  const r = p.range; let g = null;
  if (r.u) g = topojson.merge(TOPO, r.u.flatMap(n => byName[p.c+':'+n] || []));
  else if (r.r) g = topojson.merge(TOPO, unitGeoms.filter(u => u.properties.c === p.c && u.properties.r === r.r));
  else if (r.part){
    const f = topojson.feature(TOPO, byName[p.c+':'+r.part[0]][0]).geometry;
    const polys = f.type === 'MultiPolygon' ? f.coordinates : [f.coordinates];
    const pt = [r.part[1], r.part[2]];
    const hit = polys.find(pc => d3.geoContains({type:'Polygon',coordinates:pc}, pt));
    g = {type:'Polygon', coordinates: hit || polys[0]};
  }
  else if (r.a) g = ringPoly(r.a);
  return p._g = g;
}

function updateGrat(){
  if (!proj) return;
  // Visible area in projected coordinates; regenerate only when it leaves the drawn box.
  const [x0, y0] = T.invert([0, 0]), [x1, y1] = T.invert([W, H]);
  if (gratBox && x0 >= gratBox[0] && y0 >= gratBox[1] && x1 <= gratBox[2] && y1 <= gratBox[3]
      && gratBox[2] - gratBox[0] < (x1 - x0) * 3) return;
  const px = (x1 - x0) * .5, py = (y1 - y0) * .5;
  gratBox = [x0 - px, y0 - py, x1 + px, y1 + py];
  let lo0 = Infinity, la0 = Infinity, lo1 = -Infinity, la1 = -Infinity;
  for (let i = 0; i <= 4; i++) for (let j = 0; j <= 4; j++) {
    const ll = proj.invert([gratBox[0] + (gratBox[2] - gratBox[0]) * i / 4, gratBox[1] + (gratBox[3] - gratBox[1]) * j / 4]);
    if (!ll || !isFinite(ll[0]) || !isFinite(ll[1])) continue;
    lo0 = Math.min(lo0, ll[0]); lo1 = Math.max(lo1, ll[0]); la0 = Math.min(la0, ll[1]); la1 = Math.max(la1, ll[1]);
  }
  const snap = (v, f) => f(v / GRAT_STEP) * GRAT_STEP, clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const [[mlo0, mla0], [mlo1, mla1]] = GRAT_MAX;
  const e0 = [clamp(snap(lo0, Math.floor), mlo0, mlo1), clamp(snap(la0, Math.floor), mla0, mla1)];
  const e1 = [clamp(snap(lo1, Math.ceil), mlo0, mlo1), clamp(snap(la1, Math.ceil), mla0, mla1)];
  const d = e1[0] > e0[0] && e1[1] > e0[1] ? path(d3.geoGraticule().extent([e0, e1]).step([GRAT_STEP, GRAT_STEP])()) : '';
  $('#grat').setAttribute('d', d || '');
}

/* ======================= build ======================= */
function fitProjection(){
  const cfg = TABCFG[tab];
  const top = isMobile() ? 72 : 80, right = W >= 1000 ? 380 : 20;
  proj = d3.geoConicConformal().parallels(cfg.par).rotate(cfg.rot)
    .fitExtent([[20, top], [W - right, H - (isMobile() ? 70 : 34)]], {type:'MultiPoint', coordinates: cfg.fit});
  path = d3.geoPath(proj);
}
function buildGeo(){
  const other = tab === 'GBR' ? 'FRA' : 'GBR';
  $('#focusD').setAttribute('d', path(landBy[tab]) || '');
  $('#otherD').setAttribute('d', (path(landBy[other]) || '') + (path(nbLand) || ''));
  gratBox = null; updateGrat();
  $('#bMajor').setAttribute('d', path(MESH[tab].major) || '');
  $('#bMinor').setAttribute('d', path(MESH[tab].minor) || '');
  const line = d3.line().curve(d3.curveCatmullRomClosed.alpha(.5));
  let th = '';
  for (const [k, pts] of TERRAIN[tab]) {
    const d = line(pts.map(p => proj(p)));
    th += `<path class="terr ${k}" d="${d}"/>`;
    if (k === 'mount') th += `<path class="peaks" d="${d}"/>`;
  }
  $('#gTerr').innerHTML = th;
  $('#gRiv').innerHTML = RIVERS.map(f => { const d = path(f); return d ? `<path class="riv ${f.properties.s <= 9 ? 'maj' : 'min'}" d="${d}"/>` : ''; }).join('');
  $('#gLake').innerHTML = LAKES.map(f => { const d = path(f); return d ? `<path class="lake ${f.properties.s <= 6 ? 'big' : ''}" d="${d}"/>` : ''; }).join('');
  PL.forEach(p => { p.xy = proj(p.ll); });
  SL.forEach(s => { s.xy = proj(s.ll); });
}
function riverLabels(){
  if (riverLabelCache[tab]) return riverLabelCache[tab];
  const best = {};
  for (const f of RIVERS) {
    const zh = RIVZH[f.properties.n]; if (!zh) continue;
    const lines = f.geometry.type === 'LineString' ? [f.geometry.coordinates] : f.geometry.coordinates;
    for (const ln of lines) {
      if (ln.length < 4) continue;
      const mid = ln[Math.floor(ln.length/2)];
      if (!d3.geoContains(landBy[tab], mid)) continue;
      const len = d3.geoLength({type:'LineString', coordinates: ln});
      if (!best[zh] || len > best[zh].len) best[zh] = {len, mid, e: RIVEN[f.properties.n] || f.properties.n};
    }
  }
  return riverLabelCache[tab] = Object.entries(best).map(([t,b]) => ({t, e:b.e, ll:b.mid, k:'river', l:3}));
}

    case 'B':  x0 = x - w/2;         y0 = y + 4; break;
    case 'T':  x0 = x - w/2;         y0 = top - 3 - h; break;
    case 'BR': x0 = x + s*.28;       y0 = y - 2; break;
    case 'BL': x0 = x - s*.28 - w;   y0 = y - 2; break;

const relayoutForFonts = () => { clearTimeout(fontRelayout); fontRelayout = setTimeout(() => {
  const keep = {hovered, pinned}; build(true); hovered = keep.hovered; pinned = keep.pinned; card.dataset.key = ''; refresh();
}, 60); };
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(relayoutForFonts);
  document.fonts.addEventListener?.('loadingdone', relayoutForFonts);
}
})();
